# Builds the page with trunk and the book with mdBook on every pull request, so one that breaks
# either does not merge, and publishes main's build on GitHub Pages: the page at
# https://luofang34.github.io/Eclipse/ and the book at its book/.
name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  TRUNK_VERSION: "0.21.14"
  TRUNK_SHA256: "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install trunk
        run: |
          archive="trunk-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          curl -fsSLO "$base/$archive"
          echo "$TRUNK_SHA256  $archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin trunk
          \rm "$archive"
      - name: Install mdBook
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}"
          curl -fsSLO "$base/$archive"
          echo "$MDBOOK_SHA256  $archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin mdbook
          \rm "$archive"
      - name: Build the page and the book
        # Pages serves the repository's site below /Eclipse/, so the page's script and wasm
        # are linked from there.
        run: scripts/build-site.sh /Eclipse/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/eclipse-web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
