# Builds the page with trunk and the book with mdBook on every pull request, so one that breaks
# either does not merge, and publishes main's build on GitHub Pages: the page at
# https://luofang34.github.io/Eclipse/ and the book at its book/.
name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install trunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="trunk-x86_64-unknown-linux-gnu.tar.gz"
          gh release download --repo trunk-rs/trunk --pattern "$archive" --pattern "$archive.sha256"
          echo "$(cat "$archive.sha256")  $archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin trunk
          \rm "$archive" "$archive.sha256"
      - name: Install mdBook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo rust-lang/mdBook --pattern 'mdbook-*-x86_64-unknown-linux-gnu.tar.gz'
          sudo tar -xzf mdbook-*-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin mdbook
          \rm mdbook-*-x86_64-unknown-linux-gnu.tar.gz
      - name: Build the page and the book
        # Pages serves the repository's site below /Eclipse/, so the page's script and wasm
        # are linked from there.
        run: scripts/build-site.sh /Eclipse/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/eclipse-web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
