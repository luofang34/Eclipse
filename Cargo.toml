[workspace]
resolver = "2"
members = ["crates/eclipse-core", "crates/eclipse-svg", "crates/eclipse-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
navigate-celestial = { git = "https://github.com/luofang34/Navigate", rev = "3e69bad3644ecbed71be08e7900549061c72c781" }
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
too_many_lines = "deny"

# The browser downloads the whole module before the map shows.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
