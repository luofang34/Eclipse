[package]
name = "eclipse-web"
description = "Solar and lunar eclipse maps in the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
eclipse-core = { path = "../eclipse-core" }
eclipse-svg = { path = "../eclipse-svg" }
navigate-celestial.workspace = true
cgmath = "0.18"
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
maplibre = { git = "https://github.com/luofang34/maplibre-rs-experimental", rev = "bd4c6b436e64ea5ec979b67bd701a9f78eabc0a0", default-features = false, features = ["headless", "raster"] }
wgpu = "30.0.1"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui-wgpu = "0.36.2"
serde_json = "1"
web-time = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "HtmlCanvasElement", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }
console_error_panic_hook = "0.1"
tracing-web = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "fmt"] }

[lints]
workspace = true
